name: RAG Pipeline Orchestration

on:
  workflow_dispatch:  # Manual trigger
  schedule:
    - cron: '30 9 * * 1-5'  # 9:30 AM Monday-Friday (after scraping)
  push:
    branches: [ main, develop ]
    paths:
      - 'phase2/**'
      - 'phase3/**'
      - 'raw_data/**'

env:
  PYTHON_VERSION: '3.9'
  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

jobs:
  process-and-embed:
    runs-on: ubuntu-latest
    needs: []
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Download latest scraped data
        uses: actions/download-artifact@v3
        continue-on-error: true
        with:
          name: fund-data-${{ github.run_number }}
          path: raw_data/
          
      - name: Create necessary directories
        run: |
          mkdir -p processed_data embeddings logs
          
      - name: Generate embeddings
        run: |
          cd phase2
          python free_embedding_pipeline.py
        env:
          LOG_LEVEL: INFO
          
      - name: Update vector database
        run: |
          cd phase2
          python vector_store_manager.py
        env:
          LOG_LEVEL: INFO
          
      - name: Test retrieval pipeline
        run: |
          cd phase2
          python simple_retrieval_pipeline.py
        env:
          LOG_LEVEL: INFO
          
      - name: Validate embeddings
        run: |
          python -c "
          import json
          import pickle
          from pathlib import Path
          
          # Check embeddings files
          embeddings_file = Path('phase2/embeddings.pkl')
          metadata_file = Path('phase2/metadata_store.json')
          faiss_file = Path('phase2/faiss_index.bin')
          
          if not all(f.exists() for f in [embeddings_file, metadata_file, faiss_file]):
              raise Exception('Missing embedding files')
              
          with open(embeddings_file, 'rb') as f:
              embeddings = pickle.load(f)
              print(f'Embeddings: {len(embeddings)} chunks')
              
          with open(metadata_file, 'r') as f:
              metadata = json.load(f)
              print(f'Metadata: {len(metadata)} entries')
              
          print('Embedding validation successful!')
          "
          
      - name: Test LLM integration
        run: |
          cd phase3
          python llm_config.py
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOG_LEVEL: INFO
          
      - name: Upload processed data
        uses: actions/upload-artifact@v3
        with:
          name: processed-data-${{ github.run_number }}
          path: |
            phase2/embeddings.pkl
            phase2/embeddings.json
            phase2/faiss_index.bin
            phase2/metadata_store.json
            processed_data/
          retention-days: 30
          
      - name: Commit and push embeddings
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add phase2/embeddings.pkl phase2/embeddings.json phase2/faiss_index.bin phase2/metadata_store.json processed_data/
          if git diff --staged --quiet; then
            echo "No embedding changes to commit"
          else
            git commit -m "Auto-update: Embeddings generated on $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  quality-checks:
    runs-on: ubuntu-latest
    needs: process-and-embed
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run quality checks
        run: |
          cd phase2
          python -c "
          import json
          import pickle
          import numpy as np
          from pathlib import Path
          
          print('Running quality checks...')
          
          # Check embedding dimensions
          with open('embeddings.pkl', 'rb') as f:
              embeddings = pickle.load(f)
              
          if not embeddings:
              raise Exception('No embeddings found')
              
          sample_embedding = embeddings[0]
          expected_dim = 384  # BGE-small-en-v1.5
          
          if len(sample_embedding) != expected_dim:
              raise Exception(f'Wrong embedding dimension: {len(sample_embedding)}, expected {expected_dim}')
              
          print(f'Embedding dimensions: {len(sample_embedding)} (correct)')
          
          # Check metadata consistency
          with open('metadata_store.json', 'r') as f:
              metadata = json.load(f)
              
          if len(embeddings) != len(metadata):
              raise Exception(f'Embedding count ({len(embeddings)}) != metadata count ({len(metadata)})')
              
          print(f'Data consistency: {len(embeddings)} embeddings, {len(metadata)} metadata entries')
          
          # Check FAISS index
          import faiss
          index = faiss.read_index('faiss_index.bin')
          
          if index.ntotal != len(embeddings):
              raise Exception(f'FAISS index size ({index.ntotal}) != embedding count ({len(embeddings)})')
              
          print(f'FAISS index: {index.ntotal} vectors (correct)')
          
          print('All quality checks passed!')
          "
          
      - name: Generate quality report
        run: |
          python -c "
          import json
          from datetime import datetime
          
          report = {
              'timestamp': datetime.now().isoformat(),
              'workflow_run': '${{ github.run_id }}',
              'status': 'success',
              'checks': {
                  'embedding_dimensions': 'pass',
                  'data_consistency': 'pass',
                  'faiss_index': 'pass'
              }
          }
          
          with open('quality_report.json', 'w') as f:
              json.dump(report, f, indent=2)
              
          print('Quality report generated')
          "
          
      - name: Upload quality report
        uses: actions/upload-artifact@v3
        with:
          name: quality-report-${{ github.run_number }}
          path: quality_report.json
          retention-days: 7
