name: Daily Fund Data Scraping

on:
  schedule:
    - cron: '15 9 * * 1-5'  # 9:15 AM Monday-Friday (market days)
  workflow_dispatch:  # Manual trigger for testing
  push:
    branches: [ main, develop ]
    paths: 
      - 'phase1/**'
      - 'config/**'

env:
  PYTHON_VERSION: '3.9'
  CHROME_VERSION: 'latest'

jobs:
  scrape-fund-data:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Install Chrome and WebDriver
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          chrome --version
          
      - name: Create necessary directories
        run: |
          mkdir -p raw_data processed_data logs
          
      - name: Run scraping service
        run: |
          cd phase1/scraping_service
          python scraping_service.py
        env:
          HEADLESS: true
          LOG_LEVEL: INFO
          
      - name: Run scheduler service
        run: |
          cd phase1/scheduler_service
          python scheduler_service.py
        env:
          SCHEDULE_MODE: manual
          LOG_LEVEL: INFO
          
      - name: Validate scraped data
        run: |
          python -c "
          import json
          import os
          from pathlib import Path
          
          raw_data_dir = Path('raw_data')
          if not raw_data_dir.exists():
              raise Exception('No raw_data directory found')
              
          json_files = list(raw_data_dir.glob('*.json'))
          if not json_files:
              raise Exception('No JSON files found in raw_data')
              
          print(f'Found {len(json_files)} JSON files')
          
          for file in sorted(json_files)[-3:]:  # Check last 3 files
              with open(file, 'r') as f:
                  data = json.load(f)
                  print(f'Validated {file.name}: {len(data.get(\"schemes\", []))} schemes')
          "
          
      - name: Upload scraped data
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: fund-data-${{ github.run_number }}
          path: |
            raw_data/
            logs/
          retention-days: 30
          
      - name: Commit and push changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add raw_data/ logs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update: Fund data scraped on $(date '+%Y-%m-%d %H:%M:%S')"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Notify on failure
        if: failure()
        run: |
          echo "Scraping failed! Check logs for details."
          # Add email notification logic here if needed
