name: Refresh live fund data

on:
  schedule:
    # 9:15 AM IST on weekdays (GitHub cron is UTC)
    - cron: "45 3 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scrape dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scrape.txt

      - name: Install Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Scrape Groww and publish chatbot data
        run: python scripts/publish_latest_fund_data.py

      - name: Commit published fund data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add data/latest_fund_data.json
          if git diff --staged --quiet; then
            echo "No fund-data changes to commit"
          else
            git commit -m "Refresh live fund metrics for the deployed chatbot"
            git push
          fi
